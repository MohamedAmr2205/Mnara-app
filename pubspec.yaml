name: assistant
description: Mnara assistant app - offline-first classroom toolkit for private teachers.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0 <3.33.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  intl: ^0.20.2
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  flutter_secure_storage: ^9.2.4
  cryptography: ^2.7.0
  connectivity_plus: ^6.1.4
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  timezone: ^0.10.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
