<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>بحث عن طالب</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif}
button,input{font-family:inherit}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.row{transition:transform .12s ease,border-color .15s ease}
.row:active{transform:scale(.985)}
.chip{transition:background .15s ease}
.chip:active{transform:scale(.95)}
.field:focus{outline:2px solid var(--dot);outline-offset:1px}
@media (prefers-reduced-motion:reduce){.rise{animation:none}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;direction:rtl;display:flex;flex-direction:column;font-variant-numeric:tabular-nums;{{themeVars}}">

<div style="padding:24px 20px 0;display:flex;flex-direction:column;gap:14px">

<div class="rise" style="display:flex;align-items:center;justify-content:space-between;gap:12px">
<span style="font-size:26px;font-weight:700;line-height:1.2">بحث عن طالب</span>
<div style="flex:none;display:flex;flex-direction:column;align-items:center;gap:2px" role="img" aria-label="Mnara">
<svg aria-hidden="true" width="22" height="38" viewBox="0 0 44 78"><defs><linearGradient id="lgSearch" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#00D4FF"></stop><stop offset="1" stop-color="#00D4FF" stop-opacity="0"></stop></linearGradient></defs><polygon points="3,0 41,0 27,50 17,50" fill="url(#lgSearch)"></polygon><rect x="11" y="49" width="22" height="22" rx="6" transform="rotate(45 22 60)" fill="var(--text)"></rect></svg>
<span style="font-size:11px;font-weight:700;letter-spacing:.4px;line-height:1">Mnara</span>
</div>
</div>

<div class="rise" style="animation-delay:.05s;display:flex;align-items:center;gap:10px;height:54px;padding:0 8px 0 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);color:var(--muted)">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input class="field" type="text" aria-label="دوّر بكود الطالب أو اسمه" placeholder="كود الطالب (S12) أو الاسم" value="{{ q }}" onInput="{{ setQ }}" style="flex:1;min-width:0;height:46px;border:0;background:transparent;color:var(--text);font-size:16px;font-weight:500">
<sc-if value="{{ hasQ }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ clearQ }}" aria-label="مسح البحث" style="flex:none;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
</button>
</sc-if>
</div>

<sc-if value="{{ noQ }}" hint-placeholder-val="{{ true }}">
<div class="rise" style="animation-delay:.1s;display:flex;flex-direction:column;gap:8px">
<span style="font-size:12px;color:var(--muted);font-weight:600">اللي بحثت عنهم قريب</span>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<sc-for list="{{ recents }}" as="r" hint-placeholder-count="3">
<button class="chip" onClick="{{ r.pick }}" style="height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px"><span style="direction:ltr;font-weight:700">{{ r.code }}</span>{{ r.name }}</button>
</sc-for>
</div>
</div>
</sc-if>

<div style="font-size:12px;color:var(--muted);font-weight:600">{{ countText }}</div>

</div>

<div style="flex:1;min-height:0;overflow-y:auto;padding:10px 20px 100px;display:flex;flex-direction:column;gap:8px">
<sc-for list="{{ results }}" as="s" hint-placeholder-count="6">
<a class="row" href="Student.dc.html" style="flex:none;display:flex;align-items:center;gap:10px;min-height:64px;padding:8px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--text);text-decoration:none">
<span style="flex:none;min-width:48px;text-align:center;padding:5px 6px;border-radius:10px;background:var(--sel);font-size:12px;font-weight:700;direction:ltr">{{ s.code }}</span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
<span style="font-size:15px;font-weight:600">{{ s.name }}</span>
<span style="font-size:12px;color:var(--muted);font-weight:500">{{ s.group }}</span>
</span>
<span style="flex:none;padding:4px 10px;border-radius:999px;background:{{ s.payBg }};color:{{ s.payFg }};font-size:12px;font-weight:700">{{ s.payLabel }}</span>
</a>
</sc-for>
<sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
<div style="padding:28px 16px;text-align:center;display:flex;flex-direction:column;gap:6px">
<span style="font-size:16px;font-weight:700">مفيش طالب بالاسم أو الكود ده</span>
<span style="font-size:13px;color:var(--muted);font-weight:500;line-height:1.7">جرّب الكود (S12) أو جزء من الاسم. لو طالب جديد، أضفه من شاشة الحصة.</span>
</div>
</sc-if>
</div>

<nav aria-label="التنقل الرئيسي" style="position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:8px 10px 18px;background:var(--card);border-top:1px solid var(--line)">
<a href="Groups.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600"><span style="padding:4px 18px;display:flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.6-3.4 3.2-5.5 6.5-5.5s5.9 2.1 6.5 5.5"></path><path d="M16 5a3.2 3.2 0 0 1 0 6.2M18 14.8c2 .6 3.2 2.3 3.5 5.2"></path></svg></span>المجاميع</a>
<a href="Search.dc.html" aria-current="page" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;color:var(--text);text-decoration:none;font-size:11px;font-weight:700"><span style="padding:4px 18px;display:flex;border-radius:999px;background:var(--sel)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></span>بحث</a>
<a href="History.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600"><span style="padding:4px 18px;display:flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span>السجل</a>
<a href="Settings.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600"><span style="padding:4px 18px;display:flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg></span>الإعدادات</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Look"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: '' };
  }
  themeVars() {
    const light = (this.props.theme || 'dark') === 'light';
    return light
      ? '--bg:#E8EFF3;--card:#FFFFFF;--card2:#F3F7FA;--text:#071A3D;--muted:#4A5B78;--line:rgba(7,26,61,.14);--primary:#174EA6;--dot:#174EA6;--mint:#12806C;--red:#C7343A;--redtx:#B02A30;--redbg:rgba(199,52,58,.12);--amber:#A15C00;--ambertx:#8A4F00;--amberbg:rgba(161,92,0,.12);--green:#1B8A63;--greentx:#146B4C;--greenbg:rgba(27,138,99,.12);--sel:rgba(23,78,166,.14);'
      : '--bg:#071A3D;--card:#0D2A5E;--card2:#123470;--text:#E8EFF3;--muted:#A3B0C4;--line:rgba(232,239,243,.14);--primary:#174EA6;--dot:#00D4FF;--mint:#73D9C2;--red:#E5484D;--redtx:#FF8A8E;--redbg:rgba(229,72,77,.18);--amber:#FFB020;--ambertx:#FFB020;--amberbg:rgba(255,176,32,.16);--green:#2FBF8F;--greentx:#2FBF8F;--greenbg:rgba(47,191,143,.16);--sel:rgba(23,78,166,.55);';
  }
  renderVals() {
    const q = this.state.q;
    const norm = (s) => s.replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).trim().toLowerCase();
    const nq = norm(q);
    const g1 = 'لغات أولى الأربعاء 6';
    const g2 = 'تالتة الثلاثاء 6';
    const g3 = 'تالتة السبت 2';
    const g4 = 'تانية الخميس 4';
    const all = [
      { code: 'S101', name: 'أحمد محمود', group: g1, pay: 'paid' },
      { code: 'S102', name: 'مريم خالد', group: g1, pay: 'paid' },
      { code: 'S103', name: 'يوسف عادل', group: g1, pay: 'partial' },
      { code: 'S104', name: 'نور الدين سامي', group: g1, pay: 'paid' },
      { code: 'S105', name: 'سلمى حسام', group: g1, pay: 'unpaid' },
      { code: 'S108', name: 'كريم وائل', group: g1, pay: 'unpaid' },
      { code: 'S201', name: 'آدم سعيد', group: g2, pay: 'paid' },
      { code: 'S205', name: 'بلال نادر', group: g2, pay: 'unpaid' },
      { code: 'S301', name: 'دينا عمرو', group: g2, pay: 'paid' },
      { code: 'S202', name: 'ليلى حمدي', group: g3, pay: 'paid' },
      { code: 'S203', name: 'ياسين عماد', group: g3, pay: 'partial' },
      { code: 'S204', name: 'رنا مجدي', group: g4, pay: 'paid' }
    ];
    const pay = {
      paid: { label: 'مدفوع', bg: 'var(--greenbg)', fg: 'var(--greentx)' },
      partial: { label: 'جزئي', bg: 'var(--amberbg)', fg: 'var(--ambertx)' },
      unpaid: { label: 'لسه ما دفعش', bg: 'var(--amberbg)', fg: 'var(--ambertx)' }
    };
    const matches = all.filter((s) => !nq || s.code.toLowerCase().includes(nq) || s.name.includes(q.trim()));
    const results = matches.map((s) => ({ ...s, group: 'مجموعة ' + s.group, payLabel: pay[s.pay].label, payBg: pay[s.pay].bg, payFg: pay[s.pay].fg }));
    const recents = [all[2], all[7], all[9]].map((s) => ({ code: s.code, name: s.name, pick: () => this.setState({ q: s.code }) }));
    return {
      themeVars: this.themeVars(),
      q,
      setQ: (e) => this.setState({ q: e.target.value }),
      clearQ: () => this.setState({ q: '' }),
      hasQ: q !== '',
      noQ: q === '',
      recents,
      results,
      empty: results.length === 0,
      countText: nq ? (results.length + ' نتيجة') : ('كل الطلبة · ' + all.length)
    };
  }
}
</script>
</body>
</html>
