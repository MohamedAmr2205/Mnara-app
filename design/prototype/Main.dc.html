<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>دخول الأسيستنت</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif}
button{font-family:inherit}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes beamPulse{0%,100%{opacity:.72}50%{opacity:1}}
@keyframes dotFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pop{0%{transform:scale(.55)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
.beam{animation:beamPulse 3.8s ease-in-out infinite;transform-origin:50% 100%}
.lamp{animation:dotFloat 3.8s ease-in-out infinite}
.pop{animation:pop .28s ease-out}
@keyframes shakeA{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes shakeB{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shakeA{animation:shakeA .4s ease}
.shakeB{animation:shakeB .4s ease}
.key{transition:transform .12s ease,background .12s ease}
.key:active{transform:scale(.93)}
.cta{transition:transform .12s ease,filter .12s ease}
.cta:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){.rise,.beam,.lamp,.pop,.shakeA,.shakeB{animation:none}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;direction:rtl;display:flex;flex-direction:column;align-items:center;font-variant-numeric:tabular-nums;{{themeVars}}">

<svg class="beam" aria-hidden="true" width="390" height="300" viewBox="0 0 390 300" style="position:absolute;top:0;left:0;pointer-events:none">
<defs>
<linearGradient id="loginBeam" x1="0" y1="1" x2="0" y2="0">
<stop offset="0" stop-color="#00D4FF" stop-opacity="0.2"></stop>
<stop offset="1" stop-color="#00D4FF" stop-opacity="0"></stop>
</linearGradient>
</defs>
<polygon points="40,0 350,0 208,262 182,262" fill="url(#loginBeam)"></polygon>
</svg>

<div class="rise" style="position:relative;margin-top:176px;display:flex;flex-direction:column;align-items:center;gap:6px">
<svg class="lamp" role="img" aria-label="شعار منارة" width="58" height="102" viewBox="0 0 44 78"><defs><linearGradient id="lgMain" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#00D4FF"></stop><stop offset="1" stop-color="#00D4FF" stop-opacity="0"></stop></linearGradient></defs><polygon points="3,0 41,0 27,50 17,50" fill="url(#lgMain)"></polygon><rect x="11" y="49" width="22" height="22" rx="6" transform="rotate(45 22 60)" fill="var(--text)"></rect></svg>
<div style="margin-top:8px;font-size:44px;font-weight:700;letter-spacing:.5px;line-height:1">Mnara</div>
<div style="font-size:15px;font-weight:500;color:var(--muted);margin-top:6px">نوّر على طلابك</div>
</div>

<div class="rise" style="animation-delay:.12s;margin-top:34px;display:flex;flex-direction:column;align-items:center;gap:16px">
<div style="font-size:16px;font-weight:600">{{ prompt }}</div>
<div class="{{ dotsClass }}" style="display:flex;gap:16px;height:16px;align-items:center" role="img" aria-label="أرقام الـ PIN المدخلة">
<sc-for list="{{ dots }}" as="d" hint-placeholder-count="4">
<sc-if value="{{ d.on }}" hint-placeholder-val="{{ false }}">
<span class="pop" style="width:16px;height:16px;border-radius:50%;background:var(--dot);box-shadow:0 0 14px var(--dot)"></span>
</sc-if>
<sc-if value="{{ d.off }}" hint-placeholder-val="{{ true }}">
<span style="width:16px;height:16px;box-sizing:border-box;border-radius:50%;border:2px solid var(--muted)"></span>
</sc-if>
</sc-for>
</div>
</div>

<div style="margin-top:12px;min-height:40px;width:304px;text-align:center;font-size:14px;font-weight:700;line-height:1.6;color:var(--redtx)" role="alert">{{ error }}</div>

<div class="rise" style="animation-delay:.22s;margin-top:2px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:304px;direction:ltr">
<sc-for list="{{ keys }}" as="k" hint-placeholder-count="12">
<sc-if value="{{ k.isNum }}" hint-placeholder-val="{{ true }}">
<button class="key" onClick="{{ k.press }}" disabled="{{ locked }}" style="height:58px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:24px;font-weight:600;cursor:pointer;opacity:{{ keyOp }}">{{ k.label }}</button>
</sc-if>
<sc-if value="{{ k.isBack }}" hint-placeholder-val="{{ false }}">
<button class="key" onClick="{{ k.press }}" aria-label="مسح رقم" style="height:58px;border-radius:18px;border:1px solid transparent;background:transparent;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z"></path><path d="m13 10 4 4m0-4-4 4"></path></svg>
</button>
</sc-if>
<sc-if value="{{ k.isBlank }}" hint-placeholder-val="{{ false }}">
<div></div>
</sc-if>
</sc-for>
</div>

<div class="rise" style="animation-delay:.32s;margin-top:22px;width:304px">
<sc-if value="{{ full }}" hint-placeholder-val="{{ false }}">
<a class="cta" href="Groups.dc.html" style="display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:18px;background:var(--primary);color:#fff;font-size:18px;font-weight:700;text-decoration:none;box-shadow:0 8px 24px rgba(23,78,166,.45)">دخول</a>
</sc-if>
<sc-if value="{{ notFull }}" hint-placeholder-val="{{ true }}">
<button onClick="{{ submit }}" disabled="{{ locked }}" class="cta" style="display:flex;align-items:center;justify-content:center;width:100%;height:56px;border-radius:18px;border:1px solid var(--line);background:{{ submitBg }};color:{{ submitFg }};font-size:18px;font-weight:700;cursor:pointer;opacity:{{ submitOp }}">دخول</button>
</sc-if>
<sc-if value="{{ locked }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ resetLock }}" style="margin-top:14px;width:100%;height:44px;border-radius:12px;border:1px dashed var(--line);background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer">إعادة ضبط القفل (للتجربة بس)</button>
</sc-if>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Look"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pin: '', wrong: 0, error: '', shake: 0 };
  }
  press(d) {
    const st = this.state;
    if (st.wrong >= 5 || st.pin.length >= 4) return;
    const pin = st.pin + d;
    if (pin.length === 4 && pin !== '1234') {
      const wrong = st.wrong + 1;
      this.setState({
        pin: '', wrong, shake: st.shake + 1,
        error: wrong >= 5 ? 'اتقفل بعد 5 محاولات غلط. كلّم المدرس عشان يفتحه.' : 'PIN غلط · باقي ' + (5 - wrong) + ' محاولات'
      });
      return;
    }
    this.setState({ pin, error: '' });
  }
  back() {
    if (this.state.wrong >= 5) return;
    this.setState({ pin: this.state.pin.slice(0, -1), error: '' });
  }
  themeVars() {
    const light = (this.props.theme || 'dark') === 'light';
    return light
      ? '--bg:#E8EFF3;--card:#FFFFFF;--card2:#F3F7FA;--text:#071A3D;--muted:#4A5B78;--line:rgba(7,26,61,.14);--primary:#174EA6;--dot:#174EA6;--mint:#12806C;--red:#C7343A;--redtx:#B02A30;--redbg:rgba(199,52,58,.12);--amber:#A15C00;--ambertx:#8A4F00;--amberbg:rgba(161,92,0,.12);--green:#1B8A63;--greentx:#146B4C;--greenbg:rgba(27,138,99,.12);--sel:rgba(23,78,166,.14);'
      : '--bg:#071A3D;--card:#0D2A5E;--card2:#123470;--text:#E8EFF3;--muted:#A3B0C4;--line:rgba(232,239,243,.14);--primary:#174EA6;--dot:#00D4FF;--mint:#73D9C2;--red:#E5484D;--redtx:#FF8A8E;--redbg:rgba(229,72,77,.18);--amber:#FFB020;--ambertx:#FFB020;--amberbg:rgba(255,176,32,.16);--green:#2FBF8F;--greentx:#2FBF8F;--greenbg:rgba(47,191,143,.16);--sel:rgba(23,78,166,.55);';
  }
  renderVals() {
    const pin = this.state.pin;
    const keys = ['1','2','3','4','5','6','7','8','9'].map((n) => ({ isNum: true, isBack: false, isBlank: false, label: n, press: () => this.press(n) }));
    keys.push({ isNum: false, isBack: false, isBlank: true });
    keys.push({ isNum: true, isBack: false, isBlank: false, label: '0', press: () => this.press('0') });
    keys.push({ isNum: false, isBack: true, isBlank: false, press: () => this.back() });
    const st = this.state;
    const locked = st.wrong >= 5;
    const ok = pin === '1234';
    return {
      themeVars: this.themeVars(),
      keys,
      dots: [0, 1, 2, 3].map((i) => ({ on: pin.length > i, off: pin.length <= i })),
      dotsClass: st.shake === 0 ? '' : (st.shake % 2 === 1 ? 'shakeA' : 'shakeB'),
      prompt: locked ? 'الدخول مقفول' : 'ادخل الـ PIN',
      error: st.error,
      locked,
      keyOp: locked ? 0.35 : 1,
      full: ok,
      notFull: !ok,
      submitBg: 'var(--card)',
      submitFg: 'var(--muted)',
      submitOp: locked ? 0.4 : 0.7,
      submit: () => { if (!locked && st.pin.length < 4) this.setState({ error: 'اكتب 4 أرقام' }); },
      resetLock: () => this.setState({ wrong: 0, error: '', pin: '' })
    };
  }
}
</script>
</body>
</html>
